<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="description"
      content="CR Discord 내전 참가자를 드래그해 팀을 편성하는 보드"
    />
    <title>CR 내전 팀 편성판</title>
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <header class="topbar">
      <h1>테스트</h1>
    </header>

    <main class="page-shell">
      <section class="empty-state" id="emptyState" aria-live="polite">
        <div class="empty-code" id="emptyCode">NO SESSION</div>
        <h2 id="emptyTitle">Discord에서 팀 짜기 버튼을 눌러 주세요</h2>
        <p id="emptyDescription">
          이 페이지는 봇이 만든 전용 링크로 열 때 참가자와 Riot 티어를 불러옵니다.
          API 키와 Discord 토큰은 링크나 브라우저로 전달되지 않습니다.
        </p>
      </section>

      <section class="workspace" id="workspace" hidden>
        <div class="draft-layout" id="draftLayout">
          <aside class="queue-panel panel">
            <div class="panel-heading">
              <div class="queue-heading-title">
                <h2>대기열</h2>
                <span class="count-badge" id="poolCount">0</span>
              </div>
              <div class="queue-sort" role="group" aria-label="대기열 티어 정렬">
                <button class="sort-button" id="sortHigh" type="button">높은 순</button>
                <button class="sort-button" id="sortLow" type="button">낮은 순</button>
              </div>
            </div>
            <div
              class="drop-zone player-pool"
              id="playerPool"
              data-zone-id="pool"
              data-unlimited="true"
              aria-label="배정되지 않은 참가자"
            ></div>
          </aside>

          <section class="teams-grid" id="teamsGrid" aria-label="편성 팀"></section>
        </div>

        <p class="excluded-note" id="excludedNote" hidden></p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <template id="teamTemplate">
      <section class="team-panel panel">
        <div class="team-heading">
          <div>
            <span class="team-number" aria-hidden="true">1</span>
            <strong class="team-title">1번 팀</strong>
          </div>
          <span class="team-count">0 / 5</span>
        </div>
        <div class="drop-zone team-drop"></div>
      </section>
    </template>

    <template id="playerTemplate">
      <article class="player-card" tabindex="0">
        <div class="profile-avatar" aria-hidden="true">
          <span class="avatar-fallback"></span>
          <img class="discord-avatar" alt="" draggable="false" />
        </div>
        <div class="player-identity">
          <strong class="riot-id"></strong>
        </div>
        <span class="rank-badge"></span>
      </article>
    </template>

    <script type="module" src="./app.js?v=5"></script>
  </body>
</html>
