<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="description"
      content="CR Discord 내전 참가자를 드래그해 팀을 편성하는 보드"
    />
    <title>CR 내전 팀 편성판</title>
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">CR</div>
        <div>
          <p class="eyebrow">INHOUSE CONTROL ROOM</p>
          <h1>팀 밸런스 보드</h1>
        </div>
      </div>
      <div class="command-actions" id="commandActions" hidden aria-label="팀 편성 도구">
        <button class="button button-primary" id="balanceButton" type="button">
          티어 균형 배치
        </button>
        <button class="button" id="randomButton" type="button">랜덤 배치</button>
        <button class="button" id="resetButton" type="button">대기열로 초기화</button>
        <button class="button button-copy" id="copyButton" type="button">
          Discord 결과 복사
        </button>
      </div>
    </header>

    <main class="page-shell">
      <section class="empty-state" id="emptyState" aria-live="polite">
        <div class="empty-code" id="emptyCode">NO SESSION</div>
        <h2 id="emptyTitle">Discord에서 팀 짜기 버튼을 눌러 주세요</h2>
        <p id="emptyDescription">
          이 페이지는 봇이 만든 전용 링크로 열 때 참가자와 Riot 티어를 불러옵니다.
          API 키와 Discord 토큰은 링크나 브라우저로 전달되지 않습니다.
        </p>
      </section>

      <section class="workspace" id="workspace" hidden>
        <div class="draft-layout">
          <aside class="queue-panel panel">
            <div class="panel-heading">
              <h2>대기열</h2>
              <span class="count-badge" id="poolCount">0</span>
            </div>
            <div
              class="drop-zone player-pool"
              id="playerPool"
              data-zone-id="pool"
              data-unlimited="true"
              aria-label="배정되지 않은 참가자"
            ></div>
          </aside>

          <section class="teams-grid" id="teamsGrid" aria-label="편성 팀"></section>
        </div>

        <p class="excluded-note" id="excludedNote" hidden></p>
      </section>
    </main>

    <footer class="footer">
      <span>CR CLAN · 비공식 내전 운영 도구</span>
      <span>세션 데이터는 URL 조각에만 있으며 서버로 전송되지 않습니다.</span>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <template id="teamTemplate">
      <section class="team-panel panel">
        <div class="team-heading">
          <div>
            <span class="team-number" aria-hidden="true">1</span>
            <strong class="team-title">1번 팀</strong>
          </div>
          <span class="team-count">0 / 5</span>
        </div>
        <div class="drop-zone team-drop"></div>
      </section>
    </template>

    <template id="playerTemplate">
      <article class="player-card" tabindex="0">
        <div class="profile-avatar" aria-hidden="true">
          <span class="avatar-fallback"></span>
          <img class="discord-avatar" alt="" draggable="false" />
        </div>
        <div class="player-identity">
          <strong class="display-name"></strong>
          <span class="riot-id"></span>
        </div>
        <span class="rank-badge"></span>
      </article>
    </template>

    <script type="module" src="./app.js?v=2"></script>
  </body>
</html>
